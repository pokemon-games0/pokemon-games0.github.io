<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Manga | MangaReader</title><style>body{margin:0;background:#08090d;color:#eee;font-family:system-ui;padding:30px}main{max-width:1000px;margin:auto}a{color:#8db7ff}.card{padding:20px;border:1px solid #292c36;border-radius:12px;background:#101118}</style></head><body><main><p><a href="/">← Home</a></p><div id="app">Loading…</div></main><script>const c=window.MANGAREADER_CONFIG;const slug=new URLSearchParams(location.search).get('slug');async function go(){if(!c?.SUPABASE_URL){app.textContent='Supabase is not configured.';return}const s=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);let q=s.from('manga').select('*').limit(1);if(slug)q=q.or(`slug.eq.${slug},id.eq.${slug}`);const {data,error}=await q;const m=data?.[0];if(error||!m){app.innerHTML='<div class="card"><h1>Manga not found</h1><p>The title is not available yet.</p></div>';return}app.innerHTML=`<div class="card"><h1>${m.title||''}</h1><p>${m.native_title||''}</p><p>${m.description||''}</p><p>Author: ${m.author||'—'} · Status: ${m.status||'—'}</p></div>`}go()</script></body></html>

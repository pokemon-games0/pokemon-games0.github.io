<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Country | MangaReader</title><style>body{margin:0;background:#08090d;color:#eee;font-family:system-ui;padding:30px}main{max-width:1100px;margin:auto}.card{padding:18px;border:1px solid #292c36;border-radius:12px;background:#101118;margin:10px 0}a{color:#8db7ff}</style></head><body><main><p><a href="/">← Home</a></p><h1 id="title">Manga</h1><div id="list">Loading…</div></main><script>const c=window.MANGAREADER_CONFIG;const country=new URLSearchParams(location.search).get('country')||'';title.textContent={'JP':'🇯🇵 Japan','US':'🇺🇸 United States','FR':'🇫🇷 France','BR':'🇧🇷 Brazil'}[country]||'Manga';async function go(){if(!c?.SUPABASE_URL){list.textContent='Supabase is not configured.';return}const s=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {data,error}=await s.from('manga').select('*').eq('country',country).order('created_at',{ascending:false});if(error){list.textContent='Unable to load manga yet.';return}list.innerHTML=(data||[]).map(m=>`<div class="card"><h2>${m.title||''}</h2><p>${m.description||''}</p><a href="/manga/${encodeURIComponent(m.slug||m.id)}">Open</a></div>`).join('')||'<p>No manga available yet.</p>'}go()</script></body></html>

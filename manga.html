<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Browse | MangaReader</title><style>body{margin:0;background:#08090d;color:#eee;font-family:system-ui;padding:30px}a{color:#8db7ff}main{max-width:1100px;margin:auto}.card{padding:18px;border:1px solid #292c36;border-radius:12px;background:#101118;margin:10px 0}</style></head><body><main><p><a href="/">← MangaReader</a></p><h1>Browse Manga</h1><div id="list">Loading…</div></main><script>const c=window.MANGAREADER_CONFIG;async function go(){if(!c?.SUPABASE_URL){list.textContent='Supabase is not configured.';return}const s=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {data,error}=await s.from('manga').select('*').order('created_at',{ascending:false});if(error){list.textContent='Unable to load manga yet.';return}list.innerHTML=(data||[]).map(m=>`<div class="card"><h2>${m.title||''}</h2><p>${m.description||''}</p><a href="/manga/${encodeURIComponent(m.slug||m.id)}">Open manga</a></div>`).join('')||'<p>No manga added yet.</p>'}go()</script></body></html>

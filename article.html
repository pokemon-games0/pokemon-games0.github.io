html:`
<div class="hero"><strong>Pokémon Infinite Fusion is a fan-made Pokémon RPG built around one huge idea: combine two Pokémon into one.</strong> This page now includes an interactive fusion calculator so you can choose two Pokémon, preview a hybrid design, inspect their types and stats, and instantly test the reverse combination.</div>
<img class="seo-image" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" alt="Pikachu Pokémon sprite used in the Pokémon fusion calculator" loading="lazy">
<div class="facts"><div class="fact"><b>Core feature</b>Fuse two Pokémon into one</div><div class="fact"><b>Calculator</b>Interactive browser-based preview</div><div class="fact"><b>Strategy</b>Compare head/body combinations</div><div class="fact"><b>Community</b>Large library of fan-made sprites</div></div>
<section class="fusion-tool" id="fusion-calculator" aria-label="Pokemon fusion calculator">
<div class="tool-head"><h2>🧬 Pokémon Fusion Calculator</h2><span class="chip">Live · No account required</span></div>
<p class="tool-sub">Select two Pokémon by name or National Pokédex number. The calculator creates a visual hybrid preview and calculates combined base-stat information. Try the reverse fusion to compare the opposite order.</p>
<div class="pickers">
<div class="picker"><label for="pokemonA">Pokémon #1 — Head</label><input id="pokemonA" list="pokemon-list" value="Pikachu" placeholder="e.g. Pikachu or 25" autocomplete="off"></div>
<div class="picker"><label for="pokemonB">Pokémon #2 — Body</label><input id="pokemonB" list="pokemon-list" value="Charizard" placeholder="e.g. Charizard or 6" autocomplete="off"></div>
</div>
<datalist id="pokemon-list"></datalist>
<div class="actions"><button class="btn" id="fuseBtn">Fuse Pokémon</button><button class="btn secondary" id="reverseBtn">Reverse Fusion</button><button class="btn secondary" id="randomBtn">Random Fusion</button></div>
<div class="status" id="toolStatus">Loading Pokémon data…</div>
<div class="preview" id="preview"><div class="fusion-stage"><div class="fusion-side"><img id="imgA" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu"><small id="nameA">Pikachu</small></div><div class="plus">+</div><div class="fusion-side"><img id="imgB" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png" alt="Charizard"><small id="nameB">Charizard</small></div></div></div>
<div class="result" id="result"><div class="result-title">Pikachu + Charizard</div><div class="chips"><span class="chip">Electric</span><span class="chip">Fire</span><span class="chip">Flying</span></div><p>Choose two Pokémon and press <strong>Fuse Pokémon</strong> to generate the result.</p></div>
</section>
<h2>What Is Pokémon Infinite Fusion?</h2>
<p>Pokémon Infinite Fusion is a Pokémon fan game that combines a familiar RPG adventure with a fusion mechanic. You can catch Pokémon, build a team, travel through the world, battle trainers and progress through the adventure, but the creatures on your team do not have to stay in their original forms.</p>
<p>Using fusion items, players can combine two Pokémon and create a new fused Pokémon. The result can look completely different from either parent, making discovery and experimentation a major part of the game.</p>
<h2>How Does the Fusion System Work?</h2>
<p>The most important choice is which Pokémon becomes the <strong>head</strong> and which becomes the <strong>body</strong>. This is more than a cosmetic decision. Changing the order can produce a different fusion with different visual results and gameplay characteristics.</p>
<p>That means Pokémon A + Pokémon B is worth comparing with Pokémon B + Pokémon A. Use the calculator above to test both directions quickly.</p>
<h2>Why Fusion Is So Interesting</h2>
<ul><li><strong>New appearances:</strong> two familiar Pokémon can become a completely new-looking creature.</li><li><strong>Different typings:</strong> fusion can create combinations that are not normally available on the individual Pokémon.</li><li><strong>Team building:</strong> players can experiment with offensive, defensive and unusual roles.</li><li><strong>Move and ability possibilities:</strong> the resulting Pokémon can have a different battle identity from its parents.</li><li><strong>Reverse fusions:</strong> swapping the head and body can produce another result from the same pair.</li></ul>
<h2>How This Calculator Works</h2>
<p>This page is an independent fan-made <strong>fusion preview calculator</strong>. It uses public Pokémon data from the PokeAPI and combines the two selected sprites in the browser. It is useful for experimenting with combinations, but it does <strong>not</strong> claim to reproduce the exact official Infinite Fusion sprite database or in-game fusion formulas.</p>
<h2>More Than a Fusion Generator</h2>
<p>A fusion generator normally exists to create an image or concept. Pokémon Infinite Fusion goes further because the fusion is part of a playable RPG. Your creations can be trained, leveled, used in battles and taken through the adventure.</p>
<h2>Custom Sprites and the Community</h2>
<p>One of the most enjoyable parts of Infinite Fusion is its community sprite ecosystem. Many fusion designs have custom artwork created by fans, while other combinations may use placeholder or alternative sprites. This gives the same Pokémon pair room for different visual interpretations.</p>
<h2>What Can You Do in Pokémon Infinite Fusion?</h2>
<ul><li>Catch Pokémon and build your collection.</li><li>Fuse Pokémon to create new team members.</li><li>Compare different fusion orders.</li><li>Train fused Pokémon and use them in battles.</li><li>Explore the game's regions, routes and story content.</li><li>Experiment with different game modes and difficulty options.</li><li>Discover community-made fusion sprites.</li></ul>
<h2>Who Is Pokémon Infinite Fusion For?</h2>
<p>It is a strong choice for Pokémon fans who enjoy experimentation. If you like collecting, team building, unusual type combinations, fan-made designs or replaying familiar Pokémon-style adventures with different rules, the fusion mechanic gives you plenty to explore.</p>
<h2>Important: Where to Get the Game</h2>
<p>Pokémon Infinite Fusion is a fan project and <strong>does not have an official standalone website</strong>. The community warns users about websites claiming to be official. For the safest current download information, use the project's official community channels rather than an unrelated download site.</p>
<p><a class="cta" href="https://discord.gg/infinitefusion" rel="noopener noreferrer">Check the Infinite Fusion Community</a></p>
<h2>Frequently Asked Questions</h2>
<div class="faq"><h3>Is this the official Pokémon Infinite Fusion calculator?</h3><p>No. This is an independent fan-made tool on Pokémon Games &amp; Tools. It provides a general fusion preview and should not be confused with an official Pokémon or Infinite Fusion service.</p></div>
<div class="faq"><h3>Can I reverse a fusion?</h3><p>Yes. Press <strong>Reverse Fusion</strong> to swap the head and body and compare the other order.</p></div>
<div class="faq"><h3>Does the calculator show the exact Infinite Fusion sprite?</h3><p>No. The visual is a browser-generated preview using Pokémon sprites. Exact Infinite Fusion custom sprites are part of the fan game's separate sprite ecosystem.</p></div>
<div class="faq"><h3>Is the game official?</h3><p>No. Pokémon Infinite Fusion is a fan-made project and is not affiliated with or endorsed by Nintendo, Game Freak or The Pokémon Company.</p></div>
<div class="note"><strong>Disclaimer:</strong> Pokémon and related names, characters and trademarks belong to their respective rights holders. Pokémon Infinite Fusion is a fan-made project and this article/tool is independently published by Pokémon Games &amp; Tools.</div>
`
}
};
const a=articles[slug];
document.title=a?a.title+' — Pokémon Games & Tools':'Article — Pokémon Games & Tools';
document.getElementById('app').innerHTML=a?`<a class="back" href="/">← Pokémon Games &amp; Tools</a><span class="tag">${a.tag}</span><h1>${a.title}</h1>${a.html}`:`<a class="back" href="/">← Pokémon Games &amp; Tools</a><h1>Article not found</h1><p>The requested article does not exist.</p>`;

const cache={};
async function getPokemon(value){
  const key=String(value||'').trim().toLowerCase();
  if(!key) throw new Error('Enter a Pokémon name or number.');
  if(cache[key]) return cache[key];
  const res=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(key));
  if(!res.ok) throw new Error('Pokémon not found: '+value);
  const p=await res.json(); cache[key]=p; return p;
}
function types(p){return p.types.sort((a,b)=>a.slot-b.slot).map(x=>x.type.name.replace(/-/g,' '));}
function stats(p){return Object.fromEntries(p.stats.map(x=>[x.stat.name,x.base_stat]));}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
async function renderFusion(){
  if(slug!=='pokemon-infinite-fusion') return;
  const status=document.getElementById('toolStatus'); if(!status)return;
  const aInput=document.getElementById('pokemonA'),bInput=document.getElementById('pokemonB');
  status.textContent='Calculating fusion…'; status.classList.remove('error');
  try{
    const [a,b]=await Promise.all([getPokemon(aInput.value),getPokemon(bInput.value)]);
    aInput.value=a.name[0].toUpperCase()+a.name.slice(1); bInput.value=b.name[0].toUpperCase()+b.name.slice(1);
    const sa=stats(a),sb=stats(b);
    const combined={hp:Math.round((sa.hp+sb.hp)/2),attack:Math.round((sa.attack+sb.attack)/2),defense:Math.round((sa.defense+sb.defense)/2),specialAttack:Math.round((sa['special-attack']+sb['special-attack'])/2),specialDefense:Math.round((sa['special-defense']+sb['special-defense'])/2),speed:Math.round((sa.speed+sb.speed)/2)};
    const allTypes=[...new Set([...types(a),...types(b)])];
    const imgA=document.getElementById('imgA'),imgB=document.getElementById('imgB');
    imgA.src=a.sprites.other?.['official-artwork']?.front_default||a.sprites.front_default; imgB.src=b.sprites.other?.['official-artwork']?.front_default||b.sprites.front_default;
    imgA.alt=a.name;imgB.alt=b.name;document.getElementById('nameA').textContent=a.name;document.getElementById('nameB').textContent=b.name;
    const title=a.name[0].toUpperCase()+a.name.slice(1)+' + '+b.name[0].toUpperCase()+b.name.slice(1);
    const result=document.getElementById('result');
    result.innerHTML='<div class="result-title">'+title+'</div><div class="chips">'+allTypes.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div><p><strong>Average base stats:</strong> HP '+combined.hp+' · Attack '+combined.attack+' · Defense '+combined.defense+' · Sp. Atk '+combined.specialAttack+' · Sp. Def '+combined.specialDefense+' · Speed '+combined.speed+'</p><p class="status">Preview only — this calculator does not reproduce the game's exact fusion formulas or custom sprite database.</p>';
    status.textContent='Fusion ready. Try Reverse Fusion to swap the two Pokémon.';
  }catch(e){status.textContent=e.message;status.classList.add('error');}
}
if(slug==='pokemon-infinite-fusion'){
  const list=document.getElementById('pokemon-list');
  fetch('https://pokeapi.co/api/v2/pokemon?limit=1025').then(r=>r.json()).then(data=>{list.innerHTML=data.results.map((p,i)=>'<option value="'+p.name+'">'+(i+1)+'</option>').join('');document.getElementById('toolStatus').textContent='Ready — choose two Pokémon.'}).catch(()=>document.getElementById('toolStatus').textContent='Ready — enter a Pokémon name or number.');
  document.getElementById('fuseBtn').addEventListener('click',renderFusion);
  document.getElementById('reverseBtn').addEventListener('click',()=>{const a=document.getElementById('pokemonA'),b=document.getElementById('pokemonB');[a.value,b.value]=[b.value,a.value];renderFusion();});
  document.getElementById('randomBtn').addEventListener('click',()=>{document.getElementById('pokemonA').value=Math.floor(Math.random()*1025)+1;document.getElementById('pokemonB').value=Math.floor(Math.random()*1025)+1;renderFusion();});
}
</script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="MangaReader — discover manga, latest chapters and releases from Japan, USA, France and Brazil."><title>MangaReader — Global Manga Hub</title><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#183b73}.navlinks{display:flex;gap:22px;color:#9ea2b0;font-size:14px}.hero{padding:68px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(42px,6vw,72px);margin:14px 0}.hero p{max-width:650px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:24px 5%}.country-row{border-bottom:1px solid #22252e;padding:30px 0}.country-head{display:flex;align-items:center;gap:14px;margin-bottom:15px}.country-title{font-size:22px;font-weight:800}.country-line{height:1px;background:#22252e;flex:1}.latest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:16px;border:1px solid #242732;border-radius:11px;background:#101118}.loading,.empty{padding:20px;color:#9296a5}.footer{border-top:1px solid #20222b;padding:25px 5%;color:#777b89;font-size:12px}@media(max-width:900px){.latest-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{height:auto;padding:14px 5%;gap:12px;align-items:flex-start}.navlinks{gap:10px;flex-wrap:wrap}.hero{padding:45px 5%}.latest-grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/">Manga<span>Reader</span></a><div class="navlinks"><a href="#japan">🇯🇵 Japan</a><a href="#usa">🇺🇸 USA</a><a href="#france">🇫🇷 France</a><a href="#brazil">🇧🇷 Brazil</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Discover manga beyond borders.</h1><p>MangaReader brings together manga discovery, latest chapters and releases from Japan, the United States, France and Brazil.</p></header><main class="section" id="sections"></main><footer class="footer">© 2026 MangaReader · <a href="/japan-blog.html">Japan Blog</a> · <a href="/france-blog.html">France Blog</a></footer><script>const cfg=window.MANGAREADER_CONFIG||{};const countries=[['JP','japan','🇯🇵 Japan'],['US','usa','🇺🇸 United States'],['FR','france','🇫🇷 France'],['BR','brazil','🇧🇷 Brazil']];const main=document.getElementById('sections');countries.forEach(([code,id,label])=>{const s=document.createElement('section');s.id=id;s.className='country-row';s.innerHTML=`<div class="country-head"><div class="country-title">${label}</div><div class="country-line"></div></div><div id="${code}" class="latest-grid"><div class="loading">Loading chapters...</div></div>`;main.appendChild(s)});async function load(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){document.querySelectorAll('.loading').forEach(x=>x.textContent='Configure Supabase to load manga data.');return}try{const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await sb.from('chapters').select('id,title,chapter_number,country,slug').order('created_at',{ascending:false}).limit(80);if(error)throw error;countries.forEach(([code])=>{const el=document.getElementById(code);const rows=(data||[]).filter(x=>x.country===code);el.innerHTML=rows.length?rows.map(x=>`<a class="item" href="/chapter/${encodeURIComponent(x.slug||x.id)}"><b>${x.title||'Manga chapter'}</b><div style="color:#9296a5;margin-top:8px">Chapter ${x.chapter_number??''}</div></a>`).join(''):'<div class="empty">No chapters available yet.</div>'})}catch(e){document.querySelectorAll('.loading').forEach(x=>x.textContent='Manga data is not available yet.');console.error(e)}}load();</script></body></html>
